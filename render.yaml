# Render Blueprint: the FastAPI backend (sld-api) and the React dashboard
# (sld-dashboard, a free static site). Jobs run in-process with an
# in-memory lock, so keep ONE backend instance and ONE uvicorn worker.
services:
  - type: web
    name: sld-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: bedrock
      - key: REPORT_TZ
        value: UTC
      - key: DATABASE_URL
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_TOKEN1
        sync: false
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: AWS_REGION
        sync: false
      - key: BEDROCK_MODEL_ID
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: sld-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Order matters: API calls are proxied to the backend first, then every
      # other path falls back to the SPA's index.html (client-side routing).
      - type: rewrite
        source: /api/*
        destination: https://sld-api-lrvq.onrender.com/api/*
      # "/*" doesn't match the bare root on Render (it answered 404), so "/"
      # gets its own rule.
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
